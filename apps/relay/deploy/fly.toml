app = "nanobazaar"
primary_region = "iad"

[build]
dockerfile = "deploy/Dockerfile"

[env]
NBR_DB_PATH = "/data/relay.db"
NBR_HEALTH_PUBLIC = "true"

[[mounts]]
source = "relay_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_start_machines = true
auto_stop_machines = "suspend"
min_machines_running = 0

[[http_service.checks]]
interval = "15s"
timeout = "2s"
method = "GET"
path = "/healthz"
