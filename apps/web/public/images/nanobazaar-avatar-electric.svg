<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">NanoBazaar electric avatar</title>
  <desc id="description">The symmetric NanoBazaar N mark in electric blue on deep ink navy.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="74%">
      <stop offset="0" stop-color="#111F3D"/>
      <stop offset=".58" stop-color="#080F20"/>
      <stop offset="1" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="light" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#2563EB" stop-opacity=".08"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surface" x1="244" y1="184" x2="790" y2="842" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset=".32" stop-color="#4FA4FA"/>
      <stop offset=".67" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="highlight" x1="512" y1="176" x2="512" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity=".48"/>
    </filter>
    <mask id="mark" maskUnits="userSpaceOnUse" x="112" y="112" width="800" height="800">
      <g transform="translate(112 112) scale(3.125)">
        <path fill="#FFF" d="M32 28h55c3 0 6 1 8 4l58 75c2 2 3 5 3 8v5c0 4-2 6-5 7-2 1-4 0-6-1l-53-31v125c0 5-3 8-8 8H32c-5 0-8-3-8-8V36c0-5 3-8 8-8Z"/>
        <path fill="#FFF" d="M32 28h55c3 0 6 1 8 4l58 75c2 2 3 5 3 8v5c0 4-2 6-5 7-2 1-4 0-6-1l-53-31v125c0 5-3 8-8 8H32c-5 0-8-3-8-8V36c0-5 3-8 8-8Z" transform="rotate(180 128 128)"/>
      </g>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <ellipse cx="512" cy="466" rx="440" ry="420" fill="url(#light)"/>
  <g transform="translate(76.8 76.8) scale(0.85)">
    <g transform="translate(112 112) scale(3.125)" filter="url(#shadow)">
      <path fill="#020617" d="M32 28h55c3 0 6 1 8 4l58 75c2 2 3 5 3 8v5c0 4-2 6-5 7-2 1-4 0-6-1l-53-31v125c0 5-3 8-8 8H32c-5 0-8-3-8-8V36c0-5 3-8 8-8Z"/>
      <path fill="#020617" d="M32 28h55c3 0 6 1 8 4l58 75c2 2 3 5 3 8v5c0 4-2 6-5 7-2 1-4 0-6-1l-53-31v125c0 5-3 8-8 8H32c-5 0-8-3-8-8V36c0-5 3-8 8-8Z" transform="rotate(180 128 128)"/>
    </g>
    <rect x="112" y="112" width="800" height="800" fill="url(#surface)" mask="url(#mark)"/>
    <rect x="112" y="112" width="800" height="800" fill="url(#highlight)" mask="url(#mark)"/>
  </g>
